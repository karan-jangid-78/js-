const createdli=document.createElement('li');
console.log(createdli)
createdli.innerHTML="Python"
document.querySelector('.ulclass').appendChild(createdli)
const addlanguage=(langname)=>{
    const newli=document.createElement('li')
    // newli.textContent=`<i>${langname}</i>`
    newli.innerHTML=`<i>${langname}</i>`
    document.querySelector('.ulclass').appendChild(newli)
}
addlanguage("Cpp")
// TextContent treats input as a plain text it does not understand
// the html tags inside it
// innerHTML parse the input and detect the html tags 
// and it parses the whole tree
//Another optimal way
const addoptilanguage=(langname)=>{
    const newli=document.createElement('li')
    const textnode=document.createTextNode(langname)
    const bold=document.createElement('b')
    bold.appendChild(textnode)
    newli.appendChild(bold)
    document.querySelector('.ulclass').appendChild(newli)
}
addoptilanguage("ZigZag")
addoptilanguage("golang")

const secchild=document.querySelector('li:nth-child(2)')
console.log(secchild)
const newli=document.createElement('li')
newli.textContent="Mojo"
secchild.replaceWith(newli)
//remove
const lastchild=document.querySelector('li:last-child')
lastchild.remove()
